<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Gemini AI Assistant</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 10px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      margin: 0;
      box-sizing: border-box;
    }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      border: 1px solid #ccc;
      margin-bottom: 10px;
      padding: 5px;
    }
    .message {
      margin-bottom: 8px;
      padding: 5px;
      border-radius: 4px;
    }
    .user { background: #e3f2fd; align-self: flex-end; }
    .ai { background: #f5f5f5; }
    .input-area {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    textarea {
      width: 100%;
      height: 60px;
      resize: none;
    }
    .actions {
      display: flex;
      gap: 5px;
    }
    button {
      flex: 1;
      padding: 8px;
      cursor: pointer;
    }
    #status {
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <h3>Gemini Assistant</h3>
  <div class="chat-container" id="chat">
    <div class="message ai">ようこそ！伝票・帳票をアップロードするとAIが内容を解析して画面に反映します。</div>
  </div>
  <div class="input-area">
    <input type="file" id="fileInput" accept="image/*,application/pdf">
    <textarea id="prompt" placeholder="Enter instructions or leave blank for auto-parse..."></textarea>
    <div class="actions">
      <button id="sendBtn">Parse & Fill</button>
    </div>
    <div id="status"></div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
